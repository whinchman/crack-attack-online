name: Staging and PR previews (GitHub Pages)

# Staging, not production. Production is crackattack.217industries.com, deployed
# by deploy-site.yml over rsync.
#
# The reason to keep this: every pull request gets its own live preview URL, so
# a tweak can be played before it reaches the real site. Both point at the same
# relay, which is fine - a room made on staging is just a room.
#
# It publishes nothing unless the VITE_RELAY_BASE repository variable is set,
# so it cannot accidentally ship a build that has no relay to talk to.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine and rendering tests
        run: npm run test

      - name: Type-check the static game
        run: npm run typecheck

      - name: Lint source
        run: npm run lint

      - name: Build static game
        # The relay URL is public -- it ships in the client bundle -- so this
        # is a repository variable, not a secret. Leaving it unset makes the
        # build fall back to an unresolvable placeholder, which is why the
        # production deploy below refuses to run without it.
        run: npm run build
        env:
          VITE_RELAY_BASE: ${{ vars.VITE_RELAY_BASE }}

      - name: Validate static artifact
        run: npm run validate

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: dist-pages
          retention-days: 1

  deploy-production:
    # Gated on the relay URL being configured. Without it this workflow would
    # publish a second live site whose multiplayer cannot work, while the
    # README advertised it as canonical -- two URLs for the same game, one of
    # them broken, for an audience of six friends sharing links in Discord.
    # Set the VITE_RELAY_BASE repository variable to enable it.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.VITE_RELAY_BASE != ''
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: pages-build
          path: dist-pages

      - name: Publish production site
        # v4.8.0; pinned so an upstream tag move cannot alter this workflow.
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f
        with:
          branch: gh-pages
          folder: dist-pages
          clean-exclude: |
            pr-preview
          force: false
          attempt-limit: 6

  deploy-preview:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.validate.result == 'success')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download built site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: pages-build
          path: dist-pages

      - name: Publish or remove pull request preview
        # v1.8.1; pinned so an upstream tag move cannot alter this workflow.
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9
        with:
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
          source-dir: dist-pages
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: leifkb.github.io/crack-attack-browser
          qr-code: false
