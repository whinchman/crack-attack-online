name = "crack-attack-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed, not the legacy key-value backend (`new_classes`). Cloudflare
# recommends SQLite for all new namespaces, and it is the ONLY backend
# available on the Workers Free plan. A namespace's storage backend cannot be
# changed in place afterwards -- switching means deleting and re-provisioning
# under a new class name -- so this has to be right on the first deploy.
# Alarms (which this Room relies on for the reconnect grace window) are fully
# supported on the SQLite backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
